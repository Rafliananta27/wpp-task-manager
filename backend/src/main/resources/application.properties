server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/task_manager?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:task_user}
spring.datasource.password=${DB_PASSWORD:local_task_password}
spring.flyway.enabled=true
app.cors.origin=${FRONTEND_ORIGIN:http://localhost:5173}
spring.jackson.time-zone=UTC
